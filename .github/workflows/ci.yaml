name: CI

# Library CI, following the LattIQ CI/CD SOP shape: lint + test + SAST in one
# job via the same Make targets developers run locally (`make ci`), and an
# SBOM + vulnerability scan on pushes and tags. No CD: consumers fetch tagged
# versions through the Go module proxy.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test & SAST
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Latest stable Go: govulncheck reports standard-library vulnerabilities
      # of the toolchain it runs on, so scan with a patched one.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Lint and test
        run: make check

      - name: Security scan (SAST)
        run: make sast

  # Consumers may build with the oldest Go that go.mod allows; make sure the
  # library still compiles and passes its tests there.
  min-go:
    name: Test (minimum Go)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  sbom:
    name: SBOM and Vulnerability Scan
    # SAST already covers dependencies on PRs; the SBOM is the release artifact.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: mailer-sbom-${{ github.sha }}.cyclonedx.json
          output-file: mailer-sbom.cyclonedx.json

      - name: Scan for vulnerabilities
        uses: anchore/scan-action@v7.4.0
        with:
          sbom: mailer-sbom.cyclonedx.json
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mailer-sbom-${{ github.ref_name }}-${{ github.sha }}
          path: mailer-sbom.cyclonedx.json
